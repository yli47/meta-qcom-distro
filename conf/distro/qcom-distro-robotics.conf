require conf/distro/include/qcom-base.inc

# ros2-jazzy is the feature the multimedia images probe to pull in the ROS 2 /
# QIRP SDK / qrb-ros content. sota and selinux stay orthogonal.
DISTRO_FEATURES:append = " ros2-jazzy"
DISTRO_NAME:append = " (ROS-enabled)"

# ROS SDK cross-compilation support; ros2-jazzy-gated internally, so inert
# for a non-robotics build.
require conf/distro/include/qcom-robotics-sdk.inc
